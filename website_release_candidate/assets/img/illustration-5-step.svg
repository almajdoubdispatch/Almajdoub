<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#172B4D"/>
  <!-- Step 1 -->
  <circle cx="100" cy="200" r="40" fill="#76D2E0"/>
  <text x="100" y="210" font-family="Arial" font-size="24" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="100" y="260" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">Search Loads</text>
  <!-- Step 2 -->
  <circle cx="300" cy="200" r="40" fill="#76D2E0"/>
  <text x="300" y="210" font-family="Arial" font-size="24" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="260" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">Review Rates</text>
  <!-- Step 3 -->
  <circle cx="500" cy="200" r="40" fill="#76D2E0"/>
  <text x="500" y="210" font-family="Arial" font-size="24" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="500" y="260" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">Confirm Dispatch</text>
  <!-- Step 4 -->
  <circle cx="700" cy="200" r="40" fill="#76D2E0"/>
  <text x="700" y="210" font-family="Arial" font-size="24" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="700" y="260" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">Track Load</text>
  <!-- Arrow connectors -->
  <line x1="140" y1="200" x2="260" y2="200" stroke="#FFFFFF" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="340" y1="200" x2="460" y2="200" stroke="#FFFFFF" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="540" y1="200" x2="660" y2="200" stroke="#FFFFFF" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFFFFF" />
    </marker>
  </defs>
</svg>
